name: Custom GitHub release

on:
  push:
    tags: ['v*-custom.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing custom version tag
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install -g pnpm@11.28.5
      - run: pnpm install --frozen-lockfile
      - name: Check version tag
        run: node -e 'if (process.env.TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:custom
      - name: Pack installer
        run: |
          mkdir -p ../../dist
          npm pack --ignore-scripts --pack-destination ../../dist
          cd ../../dist
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" ../../dist/*.tgz ../../dist/SHA256SUMS.txt --verify-tag --title "Voice mode custom $TAG" --notes-file ../../CUSTOM_CHANGELOG.md
